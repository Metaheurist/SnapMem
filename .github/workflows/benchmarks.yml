name: Benchmarking

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: pytest-benchmark
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Benchmark this commit
        run: python -m pytest tests/benchmarks --benchmark-only --benchmark-json=bench-head.json

      - name: Benchmark master
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git worktree add ../base origin/master
          if (Test-Path ../base/tests/benchmarks) {
            Push-Location ../base
            python -m pytest tests/benchmarks --benchmark-only --benchmark-json="$env:GITHUB_WORKSPACE/bench-base.json"
            Pop-Location
          } else {
            Write-Host "master has no benchmarks yet; skipping comparison."
          }

      - name: Summary
        shell: pwsh
        run: python scripts/benchmark_summary.py bench-head.json bench-base.json >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: bench-*.json
          retention-days: 30
